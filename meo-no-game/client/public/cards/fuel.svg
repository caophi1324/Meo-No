<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fuelGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="80%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#431407" stop-opacity="0.2"/>
    </radialGradient>
    <linearGradient id="fuelCan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="120" r="110" fill="url(#fuelGlow)" opacity="0.4"/>

  <!-- tia năng lượng -->
  <path d="M38 60 l14 -18 l-2 22 l18 -8 l-12 18" fill="none" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M198 192 l-12 18 l2 -22 l-18 8 l12 -18" fill="none" stroke="#FDE68A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- can nhiên liệu -->
  <g transform="translate(132, 58) rotate(8)">
    <rect x="0" y="12" width="62" height="82" rx="10" fill="url(#fuelCan)" stroke="#78350F" stroke-width="3"/>
    <path d="M10 12 V2 h18 v10" fill="none" stroke="#78350F" stroke-width="4" stroke-linecap="round"/>
    <path d="M48 12 q10 -12 18 -2" fill="none" stroke="#78350F" stroke-width="4" stroke-linecap="round"/>
    <rect x="12" y="32" width="38" height="20" rx="4" fill="#431407" opacity="0.8"/>
    <path d="M22 42 h18 M31 37 v10" stroke="#FDE68A" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- mèo tiếp nhiên liệu -->
