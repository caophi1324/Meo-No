    <polygon points="82,84 76,62 94,78" fill="#FDE68A"/>
    <polygon points="152,88 162,50 132,80" fill="#D97706" stroke="#78350F" stroke-width="3"/>
    <polygon points="146,84 152,62 134,78" fill="#FDE68A"/>
    <ellipse cx="114" cy="124" rx="50" ry="44" fill="#FBBF24" stroke="#78350F" stroke-width="3.5"/>
    <!-- mắt quyết tâm -->
    <path d="M84 116 l20 6 M144 116 l-20 6" stroke="#78350F" stroke-width="5" stroke-linecap="round"/>
    <circle cx="94" cy="124" r="3" fill="#431407"/>
    <circle cx="134" cy="124" r="3" fill="#431407"/>
    <!-- miệng -->
    <polygon points="110,134 118,134 114,139" fill="#78350F"/>
    <path d="M102 146 q12 10 24 0" fill="none" stroke="#78350F" stroke-width="3" stroke-linecap="round"/>
    <!-- tay cầm vòi -->
    <path d="M148 150 q26 8 24 -24" fill="none" stroke="#78350F" stroke-width="7" stroke-linecap="round"/>
    <circle cx="172" cy="124" r="6" fill="#FDE68A" stroke="#78350F" stroke-width="2"/>
  </g>

  <!-- giọt nhiên liệu -->
  <path d="M58 168 q-10 16 0 22 q10 -6 0 -22 Z" fill="#FDE68A" stroke="#B45309" stroke-width="2"/>
  <path d="M80 184 q-8 13 0 18 q8 -5 0 -18 Z" fill="#FBBF24" stroke="#B45309" stroke-width="2" opacity="0.8"/>
