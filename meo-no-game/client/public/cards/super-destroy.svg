<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="destroyGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE4E6"/>
      <stop offset="40%" stop-color="#FB7185"/>
      <stop offset="75%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#4C0519" stop-opacity="0.2"/>
    </radialGradient>
    <linearGradient id="bombGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
  </defs>

  <circle cx="120" cy="120" r="110" fill="url(#destroyGlow)" opacity="0.4"/>

  <!-- mảnh vỡ -->
  <path d="M28 58 l22 10 l-14 16 Z" fill="#FB7185" opacity="0.85"/>
