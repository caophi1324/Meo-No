    <polygon points="76,92 64,54 96,82" fill="#BE123C" stroke="#4C0519" stroke-width="3"/>
    <polygon points="82,88 76,66 94,82" fill="#FDA4AF"/>
    <polygon points="150,92 162,54 130,82" fill="#BE123C" stroke="#4C0519" stroke-width="3"/>
    <polygon points="144,88 150,66 132,82" fill="#FDA4AF"/>
    <ellipse cx="113" cy="126" rx="50" ry="44" fill="#FB7185" stroke="#4C0519" stroke-width="3.5"/>
    <!-- mắt -->
    <ellipse cx="94" cy="120" rx="12" ry="14" fill="#FFFFFF" stroke="#4C0519" stroke-width="2"/>
    <ellipse cx="132" cy="120" rx="12" ry="14" fill="#FFFFFF" stroke="#4C0519" stroke-width="2"/>
    <circle cx="94" cy="120" r="6" fill="#4C0519"/>
