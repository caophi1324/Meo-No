  <path d="M210 172 l-22 -6 l8 20 Z" fill="#FB7185" opacity="0.8"/>

  <!-- quả bom -->
  <g>
    <circle cx="150" cy="144" r="42" fill="url(#bombGrad)" stroke="#4C0519" stroke-width="4"/>
    <rect x="142" y="96" width="16" height="14" rx="3" fill="#4C0519"/>
    <path d="M150 96 q4 -22 24 -24" fill="none" stroke="#FDA4AF" stroke-width="4" stroke-linecap="round"/>
    <path d="M174 72 l-5 -14 l12 8 l12 -10 l-6 16" fill="none" stroke="#FDE047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="138" cy="136" r="8" fill="#FDA4AF" opacity="0.5"/>
