    <path d="M96 144 q17 16 34 0" fill="#4C0519" stroke="#4C0519" stroke-width="2"/>
    <polygon points="103 145 109 154 113 145" fill="#FFFFFF"/>
    <polygon points="117 145 123 154 127 145" fill="#FFFFFF"/>
    <!-- tay giữ bom -->
    <path d="M146 150 q14 10 16 0" fill="none" stroke="#4C0519" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- tia lửa -->
  <path d="M42 96 l10 -18 l2 20 l16 -12" fill="none" stroke="#FDE047" stroke-width="3" stroke-linecap="round"/>
  <path d="M196 102 l-8 18 l-2 -20 l-16 12" fill="none" stroke="#FDE047" stroke-width="3" stroke-linecap="round"/>
