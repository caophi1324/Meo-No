<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="skipGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="85%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.2"/>
    </radialGradient>
    <linearGradient id="speedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- Nền tốc độ xanh dương -->
  <circle cx="120" cy="120" r="110" fill="url(#skipGlow)" opacity="0.4"/>

  <!-- Vệt tốc độ Sonic Speedlines -->
  <path d="M10 60 L140 60" stroke="url(#speedGrad)" stroke-width="4" stroke-linecap="round"/>
  <path d="M5 90 L160 90" stroke="url(#speedGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M20 120 L170 120" stroke="url(#speedGrad)" stroke-width="7" stroke-linecap="round"/>
  <path d="M15 150 L150 150" stroke="url(#speedGrad)" stroke-width="5" stroke-linecap="round"/>
  <path d="M30 180 L130 180" stroke="url(#speedGrad)" stroke-width="4" stroke-linecap="round"/>

  <!-- Đám khói bụi bứt tốc 'Vút!' -->
  <circle cx="45" cy="140" r="22" fill="#E2E8F0" opacity="0.8"/>
  <circle cx="28" cy="125" r="16" fill="#CBD5E1" opacity="0.7"/>
  <circle cx="60" cy="155" r="18" fill="#F1F5F9" opacity="0.9"/>
  <circle cx="35" cy="160" r="14" fill="#94A3B8" opacity="0.6"/>

  <!-- Mèo Tốc Độ Gió Lướt Bay (Đeo Kính Phi Công) -->
  <g transform="translate(45, 30) rotate(15 100 100)">
    <!-- Đuôi mèo duỗi thẳng theo quán tính -->
    <path d="M-10 115 Q30 108 55 110" stroke="#F97316" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M-10 115 Q30 108 55 110" stroke="#EA580C" stroke-width="3" fill="none"/>

    <!-- Thân mèo thuôn dài hình viên đạn -->
    <ellipse cx="90" cy="110" rx="46" ry="26" fill="#FB923C" stroke="#C2410C" stroke-width="3.5"/>

    <!-- Chân trước duỗi thẳng kiểu Superman -->
    <path d="M125 118 L165 118" stroke="#FB923C" stroke-width="12" stroke-linecap="round"/>
    <ellipse cx="165" cy="118" rx="8" ry="6" fill="#FDBA74"/>
    <!-- Chân sau co lại bay vút -->
    <ellipse cx="60" cy="124" rx="14" ry="8" fill="#EA580C"/>

    <!-- Đầu mèo nghiêng lướt gió -->
    <ellipse cx="120" cy="95" rx="32" ry="28" fill="#FB923C" stroke="#C2410C" stroke-width="3.5"/>

    <!-- Tai cụp ra sau vì gió mạnh -->
    <polygon points="98,82 80,68 106,72" fill="#EA580C" stroke="#9A3412" stroke-width="2.5"/>
    <polygon points="112,80 96,62 122,68" fill="#EA580C" stroke="#9A3412" stroke-width="2.5"/>

    <!-- Kính phi công tròn ngầu lòi -->
    <ellipse cx="118" cy="94" rx="13" ry="12" fill="#0284C7" stroke="#0F172A" stroke-width="3"/>
    <ellipse cx="138" cy="94" rx="13" ry="12" fill="#0284C7" stroke="#0F172A" stroke-width="3"/>
    <path d="M126 94 L130 94" stroke="#0F172A" stroke-width="3"/>
    <!-- Ánh sáng phản chiếu trên kính -->
    <path d="M112 90 L120 86 L116 100 L110 100 Z" fill="#FFFFFF" opacity="0.8"/>
    <path d="M132 90 L140 86 L136 100 L130 100 Z" fill="#FFFFFF" opacity="0.8"/>

    <!-- Miệng mèo cười tự tin 'Bye bye!' -->
    <path d="M124 108 Q134 115 142 108" stroke="#7C2D12" stroke-width="2.5" fill="none"/>
    <polygon points="126,104 132,104 129,108" fill="#FB7185"/>

    <!-- Khăn choàng cổ màu đỏ bay phấp phới sau lưng -->
    <path d="M96 98 Q70 85 45 80 Q65 102 96 106 Z" fill="#EF4444" stroke="#B91C1C" stroke-width="2"/>
    <path d="M96 102 Q60 98 35 105 Q70 115 96 108 Z" fill="#DC2626"/>
  </g>

  <!-- Biểu tượng mũi tên tua nhanh Skip ⏭️ phát sáng -->
  <g transform="translate(165, 155)">
    <polygon points="0,0 20,14 0,28" fill="#38BDF8"/>
    <polygon points="18,0 38,14 18,28" fill="#38BDF8"/>
    <rect x="38" y="0" width="5" height="28" rx="2" fill="#38BDF8"/>
  </g>
</svg>
