<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="defuseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="90%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064E3B" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="laserBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="greyFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <!-- Nền công nghệ xanh ngọc rực rỡ -->
  <circle cx="120" cy="120" r="110" fill="url(#defuseGlow)" opacity="0.35"/>
  <!-- Vòng tròn quét radar công nghệ -->
  <circle cx="120" cy="120" r="95" fill="none" stroke="#34D399" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="120" cy="120" r="65" fill="none" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
  <!-- Dấu thập ngắm laser -->
  <line x1="120" y1="20" x2="120" y2="220" stroke="#059669" stroke-width="1" stroke-dasharray="6 6" opacity="0.3"/>
  <line x1="20" y1="120" x2="220" y2="120" stroke="#059669" stroke-width="1" stroke-dasharray="6 6" opacity="0.3"/>

  <!-- Trái bom đen đang bị vô hiệu hóa ở góc -->
  <g transform="translate(140, 45)">
    <circle cx="28" cy="35" r="24" fill="#1E293B" stroke="#0F172A" stroke-width="3"/>
    <!-- Cổ bom & kíp nổ -->
    <rect x="22" y="7" width="12" height="6" fill="#64748B" rx="1"/>
    <!-- Dây ngòi bị cắt đôi -->
    <path d="M28 7 Q20 -5 10 -2" stroke="#B45309" stroke-width="3" fill="none"/>
    <path d="M2 -5 Q-5 -10 -2 -18" stroke="#B45309" stroke-width="3" fill="none"/>
    <!-- Ký hiệu cắt 'SNIP!' -->
    <text x="2" y="-12" font-family="'Fredoka', sans-serif" font-size="12" font-weight="900" fill="#FACC15">✂️</text>
    <!-- Tia sáng xanh vô hiệu hoá toả ra từ bom -->
    <circle cx="28" cy="35" r="10" fill="#34D399" opacity="0.6"/>
  </g>

  <!-- Thân & Đầu Mèo Đặc Nhiệm (Gỡ Bom) -->
  <!-- Tai mèo -->
  <polygon points="62,95 72,48 98,88" fill="url(#greyFur)" stroke="#475569" stroke-width="3"/>
  <polygon points="68,90 76,58 92,84" fill="#F472B6"/>
  <polygon points="158,95 148,48 122,88" fill="url(#greyFur)" stroke="#475569" stroke-width="3"/>
  <polygon points="152,90 144,58 128,84" fill="#F472B6"/>

  <!-- Đầu mèo xám -->
  <ellipse cx="110" cy="130" rx="52" ry="46" fill="url(#greyFur)" stroke="#334155" stroke-width="3.5"/>
  <polygon points="58,135 44,142 60,148" fill="#64748B"/>
  <polygon points="162,135 176,142 160,148" fill="#64748B"/>

  <!-- Kính bảo hộ đặc vụ công nghệ cao màu xanh Neon -->
  <rect x="66" y="105" width="88" height="32" rx="16" fill="#047857" stroke="#10B981" stroke-width="3.5"/>
  <rect x="70" y="109" width="38" height="24" rx="12" fill="#10B981" opacity="0.8"/>
  <rect x="112" y="109" width="38" height="24" rx="12" fill="#10B981" opacity="0.8"/>
  <!-- Ánh phản chiếu trên kính -->
  <path d="M76 113 L86 113 L78 129 L74 129 Z" fill="#FFFFFF" opacity="0.8"/>
  <path d="M118 113 L128 113 L120 129 L116 129 Z" fill="#FFFFFF" opacity="0.8"/>
  <!-- Dây đeo kính -->
  <path d="M66 121 L56 123 M154 121 L164 123" stroke="#0F172A" stroke-width="5"/>

  <!-- Mũi hồng & Miệng mèo đang tập trung liếm mép -->
  <polygon points="106,144 114,144 110,149" fill="#FB7185"/>
  <path d="M104 150 Q110 155 110 152 Q110 155 116 150" stroke="#1E293B" stroke-width="2.5" fill="none"/>
  <!-- Lưỡi thè ra tập trung cao độ -->
  <path d="M112 153 C112 159 122 159 120 153 Z" fill="#F43F5E"/>

  <!-- Giọt mồ hôi căng thẳng lăn trên trán -->
  <path d="M60 88 C55 83 55 77 61 77 C67 77 67 83 63 88 Z" fill="#67E8F9" stroke="#0891B2" stroke-width="1.5"/>

  <!-- Râu mèo -->
  <line x1="68" y1="145" x2="40" y2="142" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="68" y1="152" x2="42" y2="155" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="152" y1="145" x2="180" y2="142" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="152" y1="152" x2="178" y2="155" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Tay cầm kìm cắt dây & bút laser đồ chơi mèo -->
  <g transform="translate(125, 135) rotate(-20)">
    <!-- Kìm cắt đỏ/bạc -->
    <rect x="0" y="10" width="8" height="35" rx="3" fill="#EF4444" stroke="#991B1B" stroke-width="2"/>
    <rect x="14" y="10" width="8" height="35" rx="3" fill="#EF4444" stroke="#991B1B" stroke-width="2"/>
    <!-- Lưỡi kìm kim loại bạc -->
    <polygon points="4,10 8,-8 12,10" fill="#E2E8F0" stroke="#64748B" stroke-width="2"/>
    <polygon points="12,10 16,-8 20,10" fill="#CBD5E1" stroke="#64748B" stroke-width="2"/>
    <circle cx="11" cy="11" r="3" fill="#475569"/>
    <!-- Chân mèo tròn cầm kìm -->
    <ellipse cx="11" cy="30" rx="14" ry="12" fill="#94A3B8" stroke="#475569" stroke-width="2"/>
  </g>

  <!-- Tia laser mèo đỏ vui nhộn bắn trúng trái tim -->
  <path d="M40 200 L140 85" stroke="#EF4444" stroke-width="3" stroke-dasharray="4 3" opacity="0.8"/>
  <circle cx="140" cy="85" r="5" fill="#EF4444"/>
</svg>
